<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="geoviz-shared-runtime" content="1">
__META_TAGS__
  <title>__TITLE__</title>
  <style>
__INLINE_CSS__
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="viewer-loading" role="status">Loading viewer runtime…</div>
  <div id="top-actions">
    <button id="btn-quit-top" class="top-action-btn danger" title="Quit viewer" aria-label="Quit viewer">Quit Viewer</button>
    <button id="btn-toggle-commands" class="top-action-btn text-btn" title="Hide commands" aria-label="Hide commands">Hide Commands</button>
    <button id="btn-filter-panel" class="top-action-btn text-btn" title="Show filters" aria-label="Show filters">Filters</button>
    <button id="btn-capture" class="top-action-btn" title="Capture current view" aria-label="Capture current view">📷</button>
    <button id="btn-theme-mode" class="top-action-btn" title="Switch to day mode" aria-label="Switch to day mode">☾</button>
  </div>
  <div id="controls">
    <div class="panel-header controls-header">
      <h1>__TITLE__</h1>
      <button id="btn-controls-close" type="button" class="panel-close-btn controls-close-btn" title="Close commands" aria-label="Close commands">✕</button>
    </div>
    <div class="section">
      <div class="section-title">Display</div>
      <div class="control">
        <button id="btn-reset-camera" type="button">Reset camera</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Layers</div>
      <div class="layer-row master-toggle">
        <input id="toggle-all-layers" type="checkbox" checked>
        <div class="layer-label">Toggle all</div>
      </div>
      <div id="layer-list"></div>
    </div>
  </div>
  <div id="filter-panel" class="collapsed" aria-hidden="true">
    <div class="filter-panel-header">
      <div class="filter-panel-title">Filtration</div>
      <button id="btn-filter-close" type="button" class="panel-close-btn filter-close-btn" title="Close filters" aria-label="Close filters">✕</button>
    </div>
    <div class="section">
      <div class="section-title">Rules</div>
      <div id="filter-rules-list" class="filter-rules-list"></div>
      <div class="filter-rule-actions">
        <button id="btn-filter-add-rule" type="button" class="filter-add-rule-btn">Add Rule</button>
        <button id="btn-filter-reset-rules" type="button" class="filter-reset-rules-btn">Reset Rules</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Masked Region</div>
      <div class="filter-control">
        <label for="filter-masked-opacity">Visibility</label>
        <input id="filter-masked-opacity" type="range" min="0" max="1" step="0.01" value="0">
        <div id="filter-masked-opacity-value" class="filter-value-label">0.00</div>
      </div>
    </div>
  </div>
  <div id="info-panel">
    <div class="info-row">
      <div class="info-item">
        <span class="info-label">Points:</span>
        <span class="info-value" id="info-points">--</span>
      </div>
      <div class="info-item">
        <span class="info-label">Vertices:</span>
        <span class="info-value" id="info-vertices">--</span>
      </div>
      <div class="info-item">
        <span class="info-label">Faces:</span>
        <span class="info-value" id="info-faces">--</span>
      </div>
    </div>
  </div>
  <div id="hover-tooltip"></div>
  <div id="dropdown-portal"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.9/build/index.module.js"
      }
    }
  </script>
  <script id="viewer-payload" type="application/json">__PAYLOAD_JSON__</script>
  <script type="module">
__INLINE_JS__
  </script>
</body>
</html>
